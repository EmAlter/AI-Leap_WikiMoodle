site_name: Wiki - Sperimentazioni di Machine Learning in Moodle
site_url: https://emalter.github.io/AI-Leap_WikiMoodle/
repo_url: https://github.com/EmAlter/AI-Leap_WikiMoodle
repo_name: emalter/AI-Leap_WikiMoodle

nav:
  - Home: index.md
  - Documentazione:
    - Progetto: project.md
    - Diagramma Interattivo: diagram.md
    - Tesi: thesis.md
  - Preparazione del Sistema:
    - Codice iniettato e Plugins: plugin.md
    - Tablet: tablet.md
    - File CSV e XML: csv.md
  - Mapping dei Nomi: mapping.md
  - Casi d'Uso:
    - Attore: actor.md
    - Gestire le Sperimentazioni:
      - Sperimentazione: experiment.md
      - Corso: course.md
      - Test: test.md
      - Documento di Test: test_document.md
      - Intervento: intervention.md
    - Gestire le Attività:
      - Attività: activity.md
      - Raccolta di Attività: activity_collection.md
      - Domande e Risposte: questions_and_responses.md
    - Gestire i Ruoli:
      - Ruolo: role.md
      - Permessi: permission.md
    - Gestire gli Utenti:
      - Utente: user.md
    - Gestire le Classi:
      - Classe: class.md
    - Visualizzare i Risultati:
      - Risultato: results.md
  - Esempio guidato:
    - Introduzione: guided_example.md
    - Esempio di Attività: guided_example_activity.md
    - Esempio di Ruolo, Classe e Utente: guided_example_role_class_user.md
    - Esempio di Sperimentazione: guided_example_experiment.md
  
  # - Albero: tree.md  rimosso perché non più necessario
  
plugins:
  - search
  - callouts
  - mkdocs-pdf
  - graph:
      name: "title"
  - mkdocs-video:
      is_video: True
      video_autoplay: True
      video_loop: True
      video_muted: True
      video_controls: False

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.mark
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower

extra_css:
  - stylesheets/extra.css
  - assets/diagram/diagram.css

extra_javascript:
  - https://unpkg.com/@panzoom/panzoom/dist/panzoom.min.js
  - assets/diagram/diagram.js


theme:
  name: material
  language: it
  logo: assets/images/logo.png
  palette:
    - scheme: default
      primary: yellow
      accent: yellow
      toggle:
        icon: material/brightness-7
        name: Passa alla modalità scura
    - scheme: slate
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/brightness-4
        name: Passa alla modalità chiara
  features:
    - navigation.tabs
    - navigation.top
    - navigation.path
    - content.code.copy
    - content.tooltips
  
  icon:
    repo: 
      fontawesome/brands/github